<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>어와나 클럽노트</title>
<meta name="description" content="안양어와나 선생님용 클럽노트">
<meta property="og:title" content="어와나 클럽노트">
<meta property="og:description" content="눌러서 열고, [홈 화면에 설치]를 눌러 주세요">
<meta property="og:image" content="icon-512.png?v=2">
<meta name="theme-color" content="#21507a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="클럽노트">
<style>
:root{--pri:#21507a;--bg:#f6f7f9;--ink:#1d2330;--mute:#6b7280;--gold:#ffd400}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
body.app #app{display:block}body.app #land{display:none}
#land{max-width:440px;margin:0 auto;padding:32px 16px 48px;text-align:center}
#land img{width:112px;height:112px;border-radius:24px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
h1{font-size:24px;margin:16px 0 4px}
.sub{color:var(--mute);margin:0 0 24px;font-size:15px}
.btn{display:block;width:100%;padding:18px;font-size:20px;font-weight:700;border-radius:14px;border:0;background:var(--pri);color:#fff;margin:12px 0;text-decoration:none}
.btn.line{background:#fff;color:var(--pri);border:2px solid var(--pri);font-size:17px;padding:14px}
.box{background:#fff;border-radius:14px;padding:16px;text-align:left;line-height:1.7;font-size:16px;margin:12px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.box b{color:var(--pri)}
.hide{display:none}
.ok{background:#e8f6ec;color:#1e7a3c;font-weight:700;text-align:center}
#arrow{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);font-size:44px;animation:bob 1s infinite;display:none}
@keyframes bob{50%{transform:translate(-50%,10px)}}
</style>
</head>
<body>
<iframe id="app" title="어와나 클럽노트" allow="clipboard-write"></iframe>

<div id="land">
  <img src="icon-512.png?v=2" alt="">
  <h1>어와나 클럽노트</h1>
  <p class="sub">휴대폰 홈 화면에 앱처럼 설치해 두세요</p>

  <div id="kakao" class="box hide">카톡 안에서는 설치할 수 없어서 <b id="kb">크롬</b>으로 여는 중입니다…<br>
    <a class="btn" id="kgo" href="#">크롬으로 열기</a>
    안 열리면 오른쪽 아래 <b>⋮</b> 또는 <b>공유</b> → <b>다른 브라우저로 열기</b>를 눌러 주세요.</div>

  <button id="install" class="btn hide">📲 홈 화면에 설치</button>
  <div id="done" class="box ok hide">설치되었습니다! 홈 화면의 「클럽노트」 아이콘으로 열어 주세요.</div>

  <div id="android" class="box hide">설치 버튼이 안 보이면:<br>
    크롬 오른쪽 위 <b>⋮</b> → <b>앱 설치</b> 또는 <b>홈 화면에 추가</b></div>

  <div id="ios" class="box hide"><b>아이폰 설치 (사파리)</b><br>
    ① 아래쪽 <b>공유 버튼 (□↑)</b>을 누르세요 <span style="color:var(--mute)">(안 보이면 아래쪽 <b>···</b> 먼저)</span><br>
    ② 목록을 올려 <b>홈 화면에 추가</b><br>
    ③ 오른쪽 위 <b>추가</b></div>

  <a id="open" class="btn line" href="?app=1">설치 없이 바로 열기</a>
</div>
<div id="arrow">👇</div>

<script>
// 웹앱 주소 (Apps Script 배포 — 새 버전으로 배포해도 주소는 그대로)
var APP = "https://script.google.com/macros/s/AKfycbw2HcgjaEcwH_wP2CLS_5qB08E41Qr3R9evvqqT5BvaZUdi7g0iptgrK4J3VjTcJxX8WQ/exec";
var ua = navigator.userAgent || "", ios = /iPhone|iPad|iPod/i.test(ua), android = /Android/i.test(ua), kakao = /KAKAOTALK/i.test(ua);
var standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
function $(id){ return document.getElementById(id); }
function show(id){ $(id).classList.remove("hide"); }

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});

if (standalone || /[?&]app=1/.test(location.search)) {
  // 설치한 앱(또는 '바로 열기') → 클럽노트를 화면 가득
  document.body.className = "app";
  $("app").src = APP + "?from=app";   // 웹앱이 📲 설치 버튼을 숨김
} else if (kakao) {
  // 카톡 안 브라우저 → 크롬(안드로이드)·사파리(아이폰)로 자동으로 넘김
  var here = location.href.split("#")[0];
  var go = android
    ? "intent://" + here.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(here) + ";end"
    : "kakaotalk://web/openExternal?url=" + encodeURIComponent(here);
  if (ios) { $("kb").textContent = "사파리"; $("kgo").textContent = "사파리로 열기"; }
  $("kgo").href = go;
  show("kakao");
  setTimeout(function(){ location.href = go; }, 300);
} else if (ios) {
  show("ios");
  $("arrow").style.display = "block";
} else {
  // 안드로이드 크롬·삼성 인터넷: 설치 창을 버튼 한 번으로
  var ev = null;
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); ev = e; show("install"); $("android").classList.add("hide"); });
  $("install").onclick = function(){
    if (!ev) return;
    ev.prompt();
    ev.userChoice.then(function(r){ if (r.outcome === "accepted") { $("install").classList.add("hide"); show("done"); } ev = null; });
  };
  window.addEventListener("appinstalled", function(){ $("install").classList.add("hide"); show("done"); });
  setTimeout(function(){ if (!ev) show("android"); }, 2500);
}
</script>
</body>
</html>
